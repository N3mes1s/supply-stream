[package]
name = "supply-stream-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
futures = "0.3"
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "gzip", "brotli", "deflate", "zstd"] }
regex = "1.12"
rss = "2.0"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.17"
tar = "0.4"
tokio = { version = "1.44", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time", "io-std", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
# Rules can hot-reload at runtime, but package-format modules are compile-time
# YARA-X engine code and therefore come from the repo-owned custom build linked here.
yara-x = { path = "../../vendor/yara-x/lib", features = ["npm-module", "pypi-module", "crate-module"] }

[dev-dependencies]
